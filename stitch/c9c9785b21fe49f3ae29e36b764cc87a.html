<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>OdaRez - Rezervasyon</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#abb9d1",
                        "on-primary-fixed-variant": "#003ea8",
                        "inverse-primary": "#0053db",
                        "on-tertiary-container": "#ffede6",
                        "surface-container-lowest": "#0c0e16",
                        "surface-container-high": "#282a32",
                        "secondary-container": "#3c4a5e",
                        "surface": "#11131b",
                        "surface-dim": "#11131b",
                        "on-tertiary-fixed": "#360f00",
                        "primary-fixed": "#dbe1ff",
                        "surface-tint": "#b4c5ff",
                        "error-container": "#93000a",
                        "background": "#11131b",
                        "inverse-surface": "#e1e2ed",
                        "primary": "#b4c5ff",
                        "on-primary": "#002a78",
                        "on-surface": "#e1e2ed",
                        "tertiary-fixed": "#ffdbcd",
                        "surface-bright": "#373942",
                        "inverse-on-surface": "#2e3039",
                        "on-secondary-fixed": "#0d1c2e",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "on-secondary": "#233144",
                        "tertiary-container": "#bc4800",
                        "on-error-container": "#ffdad6",
                        "error": "#ffb4ab",
                        "secondary-fixed-dim": "#b9c7df",
                        "tertiary-fixed-dim": "#ffb596",
                        "surface-variant": "#32343d",
                        "primary-container": "#2563eb",
                        "surface-container-low": "#191b23",
                        "on-primary-fixed": "#00174b",
                        "outline-variant": "#434655",
                        "on-secondary-fixed-variant": "#3a485b",
                        "on-surface-variant": "#c3c6d7",
                        "on-background": "#e1e2ed",
                        "on-primary-container": "#eeefff",
                        "primary-fixed-dim": "#b4c5ff",
                        "outline": "#8d90a0",
                        "surface-container": "#1d1f27",
                        "surface-container-highest": "#32343d",
                        "on-tertiary": "#581e00",
                        "secondary-fixed": "#d5e3fc",
                        "tertiary": "#ffb596",
                        "on-error": "#690005",
                        "secondary": "#b9c7df"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "2xl": "48px",
                        "sm": "8px",
                        "md": "16px",
                        "margin": "24px",
                        "unit": "8px",
                        "lg": "24px",
                        "xl": "32px",
                        "gutter": "16px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "h3": ["Inter"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "h1": ["Inter"],
                        "h2": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "h3": ["20px", { "lineHeight": "1.4", "letterSpacing": "0em", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "1.2", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "letterSpacing": "0em", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "letterSpacing": "0em", "fontWeight": "400" }],
                        "h1": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "h2": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "1.2", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "letterSpacing": "0em", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#0F172A] text-on-background font-body-md min-h-screen flex items-center justify-center p-md">
<!-- Modal Backdrop -->
<div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
<!-- Modal Container -->
<div class="bg-[#1E293B] border border-[#334155] rounded-xl shadow-2xl w-full max-w-2xl flex flex-col max-h-[921px] overflow-hidden focus-within:ring-2 focus-within:ring-primary/20">
<!-- Modal Header -->
<div class="px-lg py-md border-b border-[#334155] flex justify-between items-center bg-[#1E293B] sticky top-0 z-10">
<div>
<h2 class="font-h2 text-h2 text-on-surface">Rezervasyon Oluştur</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-xs">Toplantı detaylarını eksiksiz doldurun.</p>
</div>
<button class="text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
</div>
<!-- Modal Body (Scrollable) -->
<div class="p-lg overflow-y-auto flex-1 space-y-md">
<!-- Conflict Warning Banner -->
<div class="bg-error-container/15 border border-error/20 rounded-lg p-md flex gap-sm items-start">
<span class="material-symbols-outlined text-error mt-0.5">warning</span>
<div>
<h4 class="font-label-md text-label-md text-error">Saat Çakışması Tespit Edildi</h4>
<p class="font-body-sm text-body-sm text-error/80 mt-xs">Seçtiğiniz tarih ve saat aralığında "Büyük Toplantı Odası" için başka bir rezervasyon bulunmaktadır. Lütfen saatleri güncelleyin veya farklı bir oda seçin.</p>
</div>
</div>
<form class="space-y-lg">
<!-- Section: Oda & Tarih -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Oda Seçimi -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block">Oda Seçimi <span class="text-error">*</span></label>
<div class="relative">
<select class="w-full bg-[#1E293B] border border-[#334155] rounded-md px-md py-sm font-body-md text-body-md text-on-surface appearance-none focus:outline-none focus:border-primary focus:ring-[3px] focus:ring-primary/20 transition-all">
<option disabled="" selected="" value="">Oda Seçin</option>
<option value="room1">Büyük Toplantı Odası (12 Kişi)</option>
<option value="room2">Mavi Oda (6 Kişi)</option>
<option value="room3">Sessiz Kabin 1 (2 Kişi)</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Tarih -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block">Tarih <span class="text-error">*</span></label>
<div class="relative">
<input class="w-full bg-[#1E293B] border border-[#334155] rounded-md px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-[3px] focus:ring-primary/20 transition-all [color-scheme:dark]" type="date"/>
</div>
</div>
</div>
<!-- Section: Saatler -->
<div class="grid grid-cols-2 gap-md p-md bg-[#0F172A]/50 rounded-lg border border-[#334155]/50">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block">Başlangıç Saati <span class="text-error">*</span></label>
<input class="w-full bg-[#1E293B] border border-[#334155] rounded-md px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-[3px] focus:ring-primary/20 transition-all [color-scheme:dark]" type="time" value="09:00"/>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block">Bitiş Saati <span class="text-error">*</span></label>
<input class="w-full bg-[#1E293B] border border-error rounded-md px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-error focus:ring-[3px] focus:ring-error/20 transition-all [color-scheme:dark]" type="time" value="10:30"/>
</div>
</div>
<!-- Section: Detaylar -->
<div class="space-y-md">
<!-- Toplantı Adı -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block">Toplantı Adı <span class="text-error">*</span></label>
<input class="w-full bg-[#1E293B] border border-[#334155] rounded-md px-md py-sm font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-[3px] focus:ring-primary/20 transition-all" placeholder="Örn: Q3 Pazarlama Planlaması" type="text"/>
</div>
<!-- Ekip Adı -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block">Ekip Adı</label>
<input class="w-full bg-[#1E293B] border border-[#334155] rounded-md px-md py-sm font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-[3px] focus:ring-primary/20 transition-all" placeholder="Örn: Pazarlama Ekibi" type="text"/>
</div>
</div>
</form>
</div>
<!-- Modal Footer -->
<div class="px-lg py-md border-t border-[#334155] bg-[#1E293B] flex justify-end gap-md mt-auto">
<button class="px-lg py-sm rounded-md border border-[#334155] font-label-md text-label-md text-on-surface hover:bg-[#334155]/50 transition-colors">
                    İptal
                </button>
<button class="px-lg py-sm rounded-md bg-primary text-on-primary font-label-md text-label-md hover:bg-primary/90 transition-colors shadow-sm opacity-50 cursor-not-allowed">
                    Kaydet
                </button>
</div>
</div>
</div>
</body></html>
