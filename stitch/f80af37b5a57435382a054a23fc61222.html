<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Bağlantı Sorunu - OdaRez</title>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>

<!-- Tailwind Theme Configuration -->

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#abb9d1",
                        "on-primary-fixed-variant": "#003ea8",
                        "inverse-primary": "#0053db",

                        "secondary-container": "#3c4a5e",

                        "surface-dim": "#11131b",
                        "on-tertiary-fixed": "#360f00",
                        "primary-fixed": "#dbe1ff",
                        "surface-tint": "#b4c5ff",
                        "error-container": "#93000a",
                        "background": "#11131b",
                        "inverse-surface": "#e1e2ed",
                        "primary": "#b4c5ff",
                        "on-primary": "#002a78",
                        "on-surface": "#e1e2ed",
                        "tertiary-fixed": "#ffdbcd",
                        "surface-bright": "#373942",
                        "inverse-on-surface": "#2e3039",
                        "on-secondary-fixed": "#0d1c2e",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "on-secondary": "#233144",
                        "tertiary-container": "#bc4800",
                        "on-error-container": "#ffdad6",
                        "error": "#ffb4ab",
                        "secondary-fixed-dim": "#b9c7df",
                        "tertiary-fixed-dim": "#ffb596",
                        "surface-variant": "#32343d",

                        "on-secondary-fixed-variant": "#3a485b",

                        "on-background": "#e1e2ed",
                        "on-primary-container": "#eeefff",
                        "primary-fixed-dim": "#b4c5ff",
                        "outline": "#8d90a0",
                        "surface-container": "#1d1f27",
                        "surface-container-highest": "#32343d",
                        "on-tertiary": "#581e00",
                        "secondary-fixed": "#d5e3fc",
                        "tertiary": "#ffb596",
                        "on-error": "#690005",
                        "secondary": "#b9c7df"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "2xl": "48px",
                        "sm": "8px",
                        "md": "16px",
                        "margin": "24px",
                        "unit": "8px",
                        "lg": "24px",
                        "xl": "32px",
                        "gutter": "16px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "h3": ["Inter"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "h1": ["Inter"],
                        "h2": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "h3": ["20px", { "lineHeight": "1.4", "letterSpacing": "0em", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "1.2", "letterSpacing": "0.01em", "fontWeight": "600" }],

                    }
                }
            }
        }

</head>
<body class="bg-background min-h-screen flex items-center justify-center p-margin antialiased">
<!-- Asymmetric Error Card -->
<main class="w-full max-w-[900px] bg-surface-container rounded-xl border border-outline-variant overflow-hidden shadow-2xl flex flex-col md:flex-row">
<!-- Left Column: Graphic Area -->
<div class="hidden md:block md:w-5/12 relative bg-surface-container-highest border-r border-outline-variant">
<img alt="Error state background" class="absolute inset-0 w-full h-full object-cover opacity-40 mix-blend-luminosity" data-alt="A dramatic, moody photograph of a dark server room with glowing red error lights indicating a critical failure. The scene is shot with a shallow depth of field, highlighting a complex network of disconnected cables in the foreground emitting a faint, fading crimson glow. The overall color palette is dominated by deep blacks, dark slate grays (#0F172A), and stark, high-contrast red accents. The aesthetic is modern, corporate, and highly technological, emphasizing a sense of sudden disruption in an otherwise pristine, sophisticated digital environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDBslkk0YAh1CBoKwz2jdmR9zJk-Mo0gKnT3O8iZrTqHSJlPOPyN0tttTgjFaTvm48G2t7CqbMUeMwqzLTh_y-Zn2iabq7t46xFoLKScxYefiA-U2-YjpSzj0bSVUb9b96rjCO7-SYAL2zcdGXPy4WhY1FdrCFBnkpOB-Klz8OXPPTgzjnqqi4I0n6n6vZ-U1IAT9lUdUeHCQ3H4ZJngSZyk9J9MgGDXqa9kyqxQZdJaSVAQrD1PIB-6wVpHkdWGXdk-cVP3wfRSWQ"/>
<!-- Graphic Overlay Content -->
<div class="absolute inset-0 flex items-center justify-center bg-gradient-to-t from-surface-container via-transparent to-transparent">
<div class="w-32 h-32 rounded-full bg-error-container/20 border border-error/30 flex items-center justify-center backdrop-blur-sm">
<span class="material-symbols-outlined text-[72px] text-error" style="font-variation-settings: 'FILL' 1;">
                        wifi_off
                    </span>
</div>
</div>
</div>
<!-- Right Column: Content Area -->
<div class="w-full md:w-7/12 p-xl md:p-2xl flex flex-col justify-center">
<!-- Mobile Graphic (Visible only on small screens) -->
<div class="md:hidden w-16 h-16 rounded-full bg-error-container/20 border border-error/30 flex items-center justify-center mb-lg">
<span class="material-symbols-outlined text-[32px] text-error" style="font-variation-settings: 'FILL' 1;">
                    wifi_off
                </span>
</div>
<!-- Error Messaging -->
<div class="mb-2xl">
<div class="inline-flex items-center gap-sm px-sm py-xs rounded-full bg-error-container text-on-error-container font-label-sm text-label-sm mb-lg border border-error/20">
<span class="material-symbols-outlined text-[14px]">error</span>
                    Sistem Uyarısı
                </div>
<h1 class="font-h1 text-h1 text-on-surface mb-md">
                    Bağlantı Sorunu
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                    Sunucu ile iletişim kurarken beklenmeyen bir hata oluştu. Veriler şu anda yüklenemiyor. Lütfen internet bağlantınızı kontrol edip kısa bir süre sonra tekrar deneyin.
                </p>
</div>
<!-- Actions -->
<div class="flex flex-col sm:flex-row items-center gap-md">
<button class="w-full sm:w-auto px-xl py-md bg-primary-container text-on-primary-container font-label-md text-label-md rounded-lg flex items-center justify-center gap-sm hover:bg-primary-container/90 transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background" type="button">
<span class="material-symbols-outlined text-[20px]">refresh</span>
                    Tekrar Dene
                </button>
<a class="w-full sm:w-auto px-lg py-md text-primary font-label-md text-label-md rounded-lg flex items-center justify-center gap-sm hover:bg-surface-container-highest transition-colors" href="#">
<span class="material-symbols-outlined text-[20px]">help</span>
                    Yardım Al
                </a>
</div>
<!-- Technical Detail (Optional collapsable/small text for corporate feel) -->
<div class="mt-2xl pt-lg border-t border-outline-variant">
<p class="font-body-sm text-body-sm text-outline">
                    Hata Kodu: <span class="font-mono text-on-surface-variant">ERR_CONNECTION_TIMED_OUT</span>
</p>
</div>
</div>
</main>
</body></html>
